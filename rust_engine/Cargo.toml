[package]
name = "aegis_engine"
version = "0.2.0"
edition = "2021"
description = "AEGIS High-Performance Backtest & Live Execution Engine"

[dependencies]
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
fixedbitset = "0.4"
cudarc = { version = "0.11", features = ["nvrtc", "cuda-version-from-build-system"] }


# Phase 5: Live Executor
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "native-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
dashmap = "6"
crossbeam = "0.8"
url = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenv = "0.15.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
